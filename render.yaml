services:
  - type: web
    name: smart-expense-manager
    runtime: node
    rootDir: expense-app
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MONGO_URI
        sync: false
