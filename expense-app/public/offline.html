<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מנהל הוצאות חכם</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    text-align: center;
    padding: 2rem;
  }
  .card {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    border-radius: 24px;
    padding: 3rem 2rem;
    max-width: 360px;
    width: 100%;
  }
  .icon { font-size: 5rem; margin-bottom: 1rem; }
  h1 { font-size: 1.5rem; margin-bottom: 0.75rem; }
  p { opacity: 0.85; font-size: 1rem; line-height: 1.6; margin-bottom: 1.5rem; }
  button {
    background: white;
    color: #667eea;
    border: none;
    padding: 0.875rem 2rem;
    border-radius: 50px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }
</style>
</head>
<body>
<div class="card">
  <div class="icon">📡</div>
  <h1>אין חיבור לשרת</h1>
  <p>האפליקציה צריכה חיבור לאינטרנט כדי לעבוד. בדוק את החיבור ונסה שוב.</p>
  <button onclick="location.reload()">נסה שוב</button>
</div>
</body>
</html>
